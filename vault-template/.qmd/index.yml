# Only folders named in "pattern" are searched. "ignore" removes private ones.
collections:
  vault:
    path: .
    pattern: "LAYOUT.md,personal/**/*.md"
    ignore:
      - "documents/**"
      - "inbox/**"
      - "personal/finances/**"
      - "personal/health/**"
      - "business/*/clients/**"
      - "business/*/contracts/**"
      - "business/*/finances/**"
      - "graphify-out/**"
      - "templates/**"
