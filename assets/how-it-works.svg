<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="How Ouroboros works: you ask your agent, it hands over to Ouroboros, he looks things up, and a plain answer comes back.">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB68B"/>
      <stop offset="1" stop-color="#5F7FFF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A94A6" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="900" height="440" rx="18" fill="#171B24"/>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#D6DBE6" text-anchor="middle">
    <text x="28" y="48" font-size="22" font-weight="600" text-anchor="start">How Ouroboros works</text>

    <!-- You -->
    <rect x="25" y="184" width="90" height="72" rx="12" fill="none" stroke="#8A94A6" stroke-width="1.5"/>
    <text x="70" y="226" font-size="17">You</text>

    <!-- Your agent -->
    <rect x="170" y="184" width="200" height="72" rx="12" fill="none" stroke="#5F7FFF" stroke-width="1.5"/>
    <text x="270" y="215" font-size="17">Your agent</text>
    <text x="270" y="238" font-size="14">Claude, OpenAI, DeepSeek...</text>

    <!-- Ouroboros -->
    <g transform="translate(499 82) scale(0.36)">
      <path d="M 117.6 33.8 A 68 68 0 1 1 66 41.1" fill="none" stroke="url(#body)" stroke-width="22"/>
      <path d="M 59 32.4 Q 84 18 108 27 Q 88 34 70 51.5 Z" fill="#42B491"/>
      <path d="M 124 23 C 112 16 98 16 90 24 C 87 28 90 31 95 31 L 114 34 L 97 38 C 92 40 92 45 97 48 C 106 52 116 50 122 45 L 124.8 48.3 L 136.5 29.4 C 132 27 128 24 124 23 Z" fill="#4AA3AE"/>
      <circle cx="114" cy="25.5" r="4.2" fill="#FFFFFF"/>
      <circle cx="113" cy="25.5" r="2" fill="#14213D"/>
    </g>
    <rect x="445" y="165" width="180" height="110" rx="14" fill="url(#body)"/>
    <text x="535" y="208" font-size="20" font-weight="700" fill="#14213D">Ouroboros</text>
    <text x="535" y="233" font-size="14" font-weight="600" fill="#14213D">sub-agent</text>
    <text x="535" y="251" font-size="14" font-weight="600" fill="#14213D">and bookkeeper</text>

    <!-- Tools and notes -->
    <rect x="690" y="85" width="185" height="70" rx="11" fill="none" stroke="#3FB68B" stroke-width="1.5"/>
    <text x="782" y="115" font-size="17">qmd</text>
    <text x="782" y="138" font-size="14">searches</text>

    <rect x="690" y="175" width="185" height="90" rx="11" fill="none" stroke="#B48CF2" stroke-width="1.5"/>
    <text x="782" y="205" font-size="17">Graphify</text>
    <text x="782" y="228" font-size="14">maps</text>
    <text x="782" y="248" font-size="14">asks before mapping</text>

    <rect x="690" y="285" width="185" height="70" rx="11" fill="none" stroke="#E0A13A" stroke-width="1.5"/>
    <text x="782" y="315" font-size="17">Your notes</text>
    <text x="782" y="338" font-size="14">logs, decisions, projects</text>

    <!-- Going out -->
    <g fill="none" stroke="#8A94A6" stroke-width="1.5">
      <path d="M 115 210 H 168" marker-end="url(#arrow)"/>
      <path d="M 370 210 H 443" marker-end="url(#arrow)"/>
      <path d="M 625 220 H 688" marker-end="url(#arrow)"/>
      <path d="M 656 220 V 120 H 688" marker-end="url(#arrow)"/>
      <path d="M 656 220 V 320 H 688" marker-end="url(#arrow)"/>
    </g>
    <text x="141" y="200" font-size="14">ask</text>
    <text x="407" y="200" font-size="14">hand over</text>
    <text x="655" y="108" font-size="14">look up</text>

    <!-- Coming back -->
    <g fill="none" stroke="#8A94A6" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M 782 355 V 375 Q 782 385 772 385 H 570 Q 560 385 560 375 V 278" marker-end="url(#arrow)"/>
      <path d="M 500 275 V 320 Q 500 330 490 330 H 320 Q 310 330 310 320 V 259" marker-end="url(#arrow)"/>
      <path d="M 230 256 V 320 Q 230 330 220 330 H 80 Q 70 330 70 320 V 259" marker-end="url(#arrow)"/>
    </g>
    <text x="671" y="407" font-size="14">the right notes</text>
    <text x="405" y="352" font-size="14">what he found</text>
    <text x="150" y="352" font-size="14">plain answer</text>
  </g>
</svg>
